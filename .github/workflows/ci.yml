# =============================================================================
# J2735 High-Performance Toolkit - CI Pipeline
# =============================================================================
# Security-focused: Only GitHub-maintained actions (actions/*) are used.
# =============================================================================
#
# Pipeline Flow:
#
#                            │
#                        ┌───▼───┐
#                        │Format │
#                        └───┬───┘
#                            │
#                    ┌───────┴───────┐
#                    │               │
#              ┌─────▼─────┐ ┌───────▼───────┐
#              │Build/Test │ │Static Analysis│
#              │(matrix)   │ │(cppcheck/tidy)│
#              └─────┬─────┘ └───────┬───────┘
#                    │               │
#            ┌───────┴───────┐       │
#            │               │       │
#    ┌───────▼───────┐ ┌─────▼─────┐ │
#    │Sanitizer      │ │Valgrind   │ │
#    │(ASan + UBSan) │ │(memcheck) │ │
#    └───────┬───────┘ └─────┬─────┘ │
#            │               │       │
#            └───────┬───────┴───────┘
#                    │
#                ┌───▼───┐
#                │Report │ (aggregates & posts PR comment)
#                └───────┘
#
# =============================================================================

name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # ===========================================================================
  # Job 1: Format Check (runs FIRST - gate for all other jobs)
  # ===========================================================================
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.LINTERS_PAT }}

      - name: Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              clang-format

      - name: Format code
        run: make format

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-format code"
          git push
          echo "::notice::Code was auto-formatted. A new CI run will start."

  # ===========================================================================
  # Job 2: Build & Test (Multi-platform Matrix)
  # ===========================================================================
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    needs: format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 - Compiler version boundaries
          - { os: ubuntu-22.04,     compiler: gcc-11   }
          - { os: ubuntu-22.04,     compiler: clang-13 }
          # Linux arm64 - Newest compilers + ARM architecture
          - { os: ubuntu-24.04-arm, compiler: gcc-14   }
          - { os: ubuntu-24.04-arm, compiler: clang-18 }
          # macOS arm64 - Apple Clang (clang-17)
          - { os: macos-26,         compiler: clang    }
          # macOS x64 - GCC with macOS toolchain
          - { os: macos-15-intel,   compiler: gcc-15   }
          # Windows x64 - MSVC
          - { os: windows-2025,     compiler: msvc     }
          # Windows arm64 - MSVC
          - { os: windows-11-arm,   compiler: msvc     }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build & Test (Unix)
        if: matrix.compiler != 'msvc'
        env:
          CC: ${{ matrix.compiler }}
        run: make test

      - name: Build & Test (Windows/MSVC)
        if: matrix.compiler == 'msvc'
        shell: cmd
        run: |
          if not exist build mkdir build
          for /f "delims=" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath') do set VSDIR=%%i
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          cl /std:c11 /W4 /WX /O2 /Isrc /Fe:build\J2735_run_tests.exe ^
            tests\J2735_internal_DE_VehicleEventFlags_test.c ^
            tests\J2735_internal_DF_ApproachOrLane_test.c ^
            tests\J2735_internal_DF_BSMcoreData_test.c ^
            tests\J2735_internal_DF_IntersectionReferenceID_test.c ^
            tests\J2735_internal_DF_PathPrediction_test.c ^
            tests\J2735_run_tests.c ^
            tests\J2735_UPER_test.c ^
            tests\unity.c
          build\J2735_run_tests.exe

  # ===========================================================================
  # Job 3: Static Analysis
  # ===========================================================================
  static-analysis:
    name: Static Analysis
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              cppcheck \
              clang-tidy

      - name: Run cppcheck
        id: cppcheck
        run: |
          echo "### cppcheck" > cppcheck_output.txt
          echo "" >> cppcheck_output.txt
          echo "<details>" >> cppcheck_output.txt
          echo "<summary>Click to expand</summary>" >> cppcheck_output.txt
          echo "" >> cppcheck_output.txt
          echo '```' >> cppcheck_output.txt
          if make check 2>&1 | tee -a cppcheck_output.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          echo '```' >> cppcheck_output.txt
          echo "" >> cppcheck_output.txt
          echo "</details>" >> cppcheck_output.txt
      - name: Run clang-tidy
        id: tidy
        run: |
          echo "### clang-tidy" > tidy_output.txt
          echo "" >> tidy_output.txt
          echo "<details>" >> tidy_output.txt
          echo "<summary>Click to expand</summary>" >> tidy_output.txt
          echo "" >> tidy_output.txt
          echo '```' >> tidy_output.txt
          if make tidy 2>&1 | tee -a tidy_output.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
          echo '```' >> tidy_output.txt
          echo "" >> tidy_output.txt
          echo "</details>" >> tidy_output.txt
      - name: Create summary
        if: always()
        run: |
          cppcheck_status="${{ steps.cppcheck.outputs.status }}"
          tidy_status="${{ steps.tidy.outputs.status }}"
          echo "## Static Analysis" > static_analysis_summary.txt
          echo "" >> static_analysis_summary.txt
          echo "| Tool | Status |" >> static_analysis_summary.txt
          echo "|------|--------|" >> static_analysis_summary.txt
          if [ "$cppcheck_status" = "success" ]; then
            echo "| cppcheck | ✅ |" >> static_analysis_summary.txt
          else
            echo "| cppcheck | ❌ |" >> static_analysis_summary.txt
          fi
          if [ "$tidy_status" = "success" ]; then
            echo "| clang-tidy | ✅ |" >> static_analysis_summary.txt
          else
            echo "| clang-tidy | ❌ |" >> static_analysis_summary.txt
          fi
          echo "" >> static_analysis_summary.txt
          cat cppcheck_output.txt >> static_analysis_summary.txt
          echo "" >> static_analysis_summary.txt
          cat tidy_output.txt >> static_analysis_summary.txt

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-results
          path: static_analysis_summary.txt

      - name: Fail if analysis found issues
        if: steps.cppcheck.outputs.status == 'failure' || steps.tidy.outputs.status == 'failure'
        run: |
          echo "::error::Static analysis found issues"
          exit 1

  # ===========================================================================
  # Job 4: Sanitizers (ASan + UBSan)
  # ===========================================================================
  sanitizers:
    name: Sanitizers
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Sanitizers
        id: sanitize
        run: |
          echo "## Sanitizers (ASan + UBSan)" > sanitizer_output.txt
          echo "" >> sanitizer_output.txt
          echo "<details>" >> sanitizer_output.txt
          echo "<summary>Test Output</summary>" >> sanitizer_output.txt
          echo "" >> sanitizer_output.txt
          echo '```' >> sanitizer_output.txt
          if make sanitize 2>&1 | tee -a sanitizer_output.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo '```' >> sanitizer_output.txt
            echo "" >> sanitizer_output.txt
            echo "</details>" >> sanitizer_output.txt
            echo "" >> sanitizer_output.txt
            echo "✅ No issues detected" >> sanitizer_output.txt
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo '```' >> sanitizer_output.txt
            echo "" >> sanitizer_output.txt
            echo "</details>" >> sanitizer_output.txt
            echo "" >> sanitizer_output.txt
            echo "❌ Issues detected" >> sanitizer_output.txt
          fi

      - name: Upload sanitizer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-results
          path: sanitizer_output.txt

      - name: Fail if sanitizers found issues
        if: steps.sanitize.outputs.status == 'failure'
        run: |
          echo "::error::Sanitizers detected issues"
          exit 1

  # ===========================================================================
  # Job 5: Valgrind Memory Check
  # ===========================================================================
  valgrind:
    name: Valgrind
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              valgrind

      - name: Run Valgrind
        id: valgrind
        run: |
          echo "## Valgrind Memory Check" > valgrind_output.txt
          echo "" >> valgrind_output.txt
          echo "<details>" >> valgrind_output.txt
          echo "<summary>Test Output</summary>" >> valgrind_output.txt
          echo "" >> valgrind_output.txt
          echo '```' >> valgrind_output.txt
          if make valgrind 2>&1 | tee -a valgrind_output.txt; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo '```' >> valgrind_output.txt
            echo "" >> valgrind_output.txt
            echo "</details>" >> valgrind_output.txt
            echo "" >> valgrind_output.txt
            echo "✅ No memory issues detected" >> valgrind_output.txt
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo '```' >> valgrind_output.txt
            echo "" >> valgrind_output.txt
            echo "</details>" >> valgrind_output.txt
            echo "" >> valgrind_output.txt
            echo "❌ Memory issues detected" >> valgrind_output.txt
          fi

      - name: Upload valgrind artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-results
          path: valgrind_output.txt

      - name: Fail if valgrind found issues
        if: steps.valgrind.outputs.status == 'failure'
        run: |
          echo "::error::Valgrind detected memory issues"
          exit 1

  # ===========================================================================
  # Job 6: Aggregate Report (posts single PR comment)
  # ===========================================================================
  report:
    name: Report
    needs: [static-analysis, sanitizers, valgrind]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: artifacts

      - name: Build aggregated report
        id: report
        run: |
          {
            echo "<!-- j2735-ci-report-${{ github.event.pull_request.head.sha }} -->"
            echo "# CI Report"
            echo ""
            echo "**Commit:** \`${{ github.event.pull_request.head.sha }}\`"
            echo ""
            echo "---"
            echo ""

            # Static Analysis
            if [ -f artifacts/static-analysis-results/static_analysis_summary.txt ]; then
              cat artifacts/static-analysis-results/static_analysis_summary.txt
            else
              echo "## Static Analysis"
              echo "⚠️ Results not available"
            fi
            echo ""
            echo "---"
            echo ""

            # Sanitizers
            if [ -f artifacts/sanitizer-results/sanitizer_output.txt ]; then
              cat artifacts/sanitizer-results/sanitizer_output.txt
            else
              echo "## Sanitizers"
              echo "⚠️ Results not available (job may have been skipped)"
            fi
            echo ""
            echo "---"
            echo ""

            # Valgrind
            if [ -f artifacts/valgrind-results/valgrind_output.txt ]; then
              cat artifacts/valgrind-results/valgrind_output.txt
            else
              echo "## Valgrind"
              echo "⚠️ Results not available (job may have been skipped)"
            fi
          } > report.md

          # Escape for JSON
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('report.md', 'utf8');
            const sha = '${{ github.event.pull_request.head.sha }}';
            const marker = `<!-- j2735-ci-report-${sha} -->`;

            // Find existing comment for this commit
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100
            });

            const existing = comments.data.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }
