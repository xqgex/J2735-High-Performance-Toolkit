name: Bug Report
description: Create a report to help us improve
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!
        Please fill out the sections below to help us diagnose and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create a buffer with...
        2. Call J2735_READ_BITS with...
        3. Observe incorrect value...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Reproducible Example
      description: Provide a minimal C code example that demonstrates the issue
      render: c
      placeholder: |
        #include "J2735_api.h"

        int main(void) {
            uint8_t buf[] = { 0x15, 0xBD, ... };
            // Your code here
            return 0;
        }

  - type: dropdown
    id: compiler
    attributes:
      label: Compiler
      options:
        - GCC
        - Clang
        - MSVC
        - Other (specify in additional context)
    validations:
      required: true

  - type: input
    id: compiler-version
    attributes:
      label: Compiler Version
      placeholder: "e.g., GCC 13.2.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform / Architecture
      options:
        - x86_64 Linux
        - ARM64 Linux
        - ARM32 (embedded)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
        - Other (specify in additional context)
    validations:
      required: true

  - type: textarea
    id: sanitizer-output
    attributes:
      label: Sanitizer Output (if applicable)
      description: Output from `make sanitize` or valgrind
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem
