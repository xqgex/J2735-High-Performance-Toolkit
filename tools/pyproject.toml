# pyproject.toml - Python project configuration for J2735 tools
# This file configures linters, formatters, and type checkers.

[project]
name = "j2735-tools"
version = "0.1.0"
description = "J2735 specification parser and C code generator"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Yogev Neumann", email = "yogev.j2735@gmail.com" }]
dependencies = [
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "black",
    "codespell",
    "coverage",
    "flake8",
    "mypy",
    "pylint",
    "ruff",
]
test = [
    "hypothesis>=6.0",
]

[project.urls]
Homepage = "https://github.com/xqgex/J2735-High-Performance-Toolkit"
Issues = "https://github.com/xqgex/J2735-High-Performance-Toolkit/issues"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.codespell]
ignore-words-list = "bitstring,bitwidth,bsmcoredata,bsmpartiiextension,calloc,dataelement,dsecond,endcode,endfor,ifndef,nsnnwn,startswith,uper"
check-hidden = true

[tool.coverage.run]
source = ["tools"]
omit = ["*/tools/tests/*", "*/run_tests.py", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true

[tool.flake8]
max-line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true

[tool.pylint.DESIGN]
max-attributes = 8

[tool.pylint.FORMAT]
max-line-length = 100
max-module-lines = 2000

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.'MESSAGES CONTROL']
# TODO: Disable the specific "fixme" warning (W0511) globally while the project is in development
disable = ["W0511"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
